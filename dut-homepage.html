<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage - Durban University of Technology</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#eff1f6;font-family:Arial,Helvetica,sans-serif;color:#161513;min-height:100vh}
  button{font-family:inherit}

  /* top bar */
  .top{background:#1b2636;height:43px;display:flex;align-items:center;padding:0 12px 0 4px;gap:10px}
  .brand{display:flex;align-items:center;width:60px;flex:none}
  .brand svg{width:26px;height:28px}
  .brand i{display:block;width:1px;height:22px;background:#6b7686;margin-left:14px}
  .search{flex:1;display:flex;justify-content:center}
  .sg{display:flex;width:100%;max-width:660px;height:35px;border:1px solid #5b6575;border-radius:4px;overflow:hidden;background:#1b2636}
  .sg .menu{background:#1b2636;color:#fff;border:0;font-weight:bold;font-size:14px;padding:0 14px;display:flex;align-items:center;gap:8px;cursor:pointer;flex:none}
  .sg input{flex:1;min-width:0;border:0;padding:0 14px;font-size:15px;outline:0;background:#fff}
  .sg input::placeholder{color:#6a6f78}
  .sg .go{width:34px;background:#1b2636;border:0;border-left:1px solid #5b6575;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .tools{display:flex;align-items:center;gap:20px;flex:none;width:60px;justify-content:flex-end}
  .tools button{background:none;border:0;padding:0;cursor:pointer;display:flex}
  .strip{height:8px;background:
    repeating-linear-gradient(90deg,#c9633a 0 14px,#e9a640 14px 30px,#7a5444 30px 40px,#e0cfae 40px 58px,#b8452f 58px 70px,#8d9a7a 70px 84px)}

  /* sub bar */
  .sub{height:46px;border-bottom:1px solid #8a8f98;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 23px;position:sticky;top:0;background:#eff1f6;z-index:2}
  .sub h1{margin:0;font-size:20px;font-weight:bold;color:#1b2636;display:flex;align-items:center;gap:6px}
  .pager{display:flex;align-items:center;gap:14px;font-size:14px;color:#1b2636}
  .pager .dis{color:#b0b5bd}
  .pager button{background:none;border:0;padding:0;cursor:pointer;display:flex}

  /* tiles */
  .wrap{max-width:1126px;margin:0 auto;padding:42px 20px 40px}
  .grid{display:grid;grid-template-columns:repeat(4,250px);gap:43px 42px;justify-content:center}
  .tile{position:relative;height:197px;background:#fff;border:1px solid #868c96;border-radius:4px;text-decoration:none;color:#1b5aa0;display:flex;flex-direction:column;align-items:center;padding-top:6px}
  .tile:hover{box-shadow:0 2px 10px rgba(0,0,0,.18);border-color:#5d6470}
  .tile h2{margin:0;font-size:14px;font-weight:bold;text-align:center;line-height:17px;padding:0 4px}
  .tile svg.ic{width:80px;height:80px;margin-top:22px;flex:none}
  .stat{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:14px;color:#000;display:flex;justify-content:center;align-items:baseline;gap:5px}
  .stat b{color:#9a4a2a;font-size:18px}
  .stat b + span + b{margin-left:6px}
  .warn{width:12px;height:12px;background:#cc3030;border-radius:2px;color:#fff;font-size:10px;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;align-self:center}

  @media (max-width:1100px){
    .grid{grid-template-columns:repeat(3,minmax(0,250px));gap:30px}
  }
  .mfoot{display:none;position:fixed;left:0;right:0;bottom:0;height:46px;background:#fff;border-top:2px solid #8a8f98;align-items:center;justify-content:center;gap:82px;z-index:5}
  .mfoot svg{display:block}
  .msearch{display:none}
  @media (max-width:700px){
    body{padding-bottom:46px}
    .top{height:45px;padding:0 14px 0 3px}
    .brand{width:auto}.brand i{display:none}.brand svg{width:30px;height:34px}
    .search{display:none}
    .tools{margin-left:auto;width:auto;gap:26px}
    .tools .home{display:none}.tools .msearch{display:flex}
    .sub{flex-direction:column;align-items:stretch;height:auto;padding:0;position:static}
    .sub h1{align-self:flex-start;margin:10px 0 0 14px;padding:9px 12px;border:2px solid #8bbcf5;font-size:20px;gap:14px}
    .pager{display:grid;grid-template-columns:1fr auto 1fr;height:46px;padding:0 24px 0 28px;margin-top:8px;border-bottom:1px solid #8a8f98;font-size:16px}
    .pager button:nth-of-type(2){justify-self:end}
    .pager .kebab{display:none}
    .wrap{padding:16px 44px 30px}
    .grid{grid-template-columns:1fr;gap:11px}
    .tile{height:119px;align-items:stretch;padding-top:4px}
    .tile h2{text-align:left;font-size:14px;padding:0 6px}
    .tile svg.ic{width:56px;height:56px;margin:8px auto 0}
    .stat{font-size:14px;bottom:5px}.stat b{font-size:18px}
    .mfoot{display:flex}
  }
  #kmenu{position:fixed;z-index:50;min-width:170px;background:#fff;border:1px solid #b9b7b3;border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,.28)}
  #kmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:0 18px;height:40px;font:14px Arial,Helvetica,sans-serif;color:#161513;cursor:pointer}
  #kmenu button:hover{background:#f1efec}
  .kopen{background:#5b6575!important;border-radius:50%;box-shadow:0 0 0 7px #5b6575}
</style>
<script src="users.js"></script>
</head>

<div class="mfoot">

<script>
  var me = DUTAuth.require();
  function closeKMenu() {
    var m = document.getElementById('kmenu'); if (m) m.remove();
    document.querySelectorAll('.kopen').forEach(function (b) { b.classList.remove('kopen'); });
  }
  document.querySelectorAll('[aria-label="More"]').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var wasOpen = btn.classList.contains('kopen');
      closeKMenu(); if (wasOpen) return;
      var m = document.createElement('div'); m.id = 'kmenu';
      [['New Window', function () { window.open(location.href, '_blank'); }],
       ['Help', function () { alert('Help is not available in this prototype.'); }],
       ['Sign Out', function () { DUTAuth.logout(); }]].forEach(function (i) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = i[0];
        b.addEventListener('click', function () { closeKMenu(); i[1](); });
        m.appendChild(b);
      });
      var r = btn.getBoundingClientRect();
      m.style.top = (r.bottom + 8) + 'px'; m.style.right = '8px';
      document.body.appendChild(m); btn.classList.add('kopen');
    });
  });
  document.addEventListener('click', closeKMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeKMenu(); });
</script>
</body>
